<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071725"><title>BPC Parcel Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#map{margin:0;height:100%;width:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{background:#dfe9ee}.top{position:fixed;z-index:1000;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:7px;align-items:center}.search{flex:1;display:flex;background:#0b2030f3;border:1px solid #31566c;border-radius:15px;overflow:hidden;box-shadow:0 4px 18px #0004}.search input{flex:1;min-width:0;background:transparent;border:0;color:#fff;padding:13px;font-size:15px;outline:0}.search input::placeholder{color:#a8bdc8}.search button{border:0;background:#43c9d2;color:#062633;font-weight:900;padding:0 15px}.round{width:46px;height:46px;border:1px solid #31566c;background:#0b2030f3;color:#eaf6fb;border-radius:14px;font-size:18px;box-shadow:0 4px 18px #0004}.status{position:fixed;z-index:900;top:64px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:#0b2030e8;color:#dcecf4;border:1px solid #31566c;border-radius:999px;padding:7px 11px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 12px #0003}.status.ok{border-color:#2b875d}.status.bad{border-color:#9a4550}.results{position:fixed;z-index:1200;top:61px;left:8px;width:min(430px,calc(100% - 16px));max-height:42vh;overflow:auto;background:#0b2030fb;color:#fff;border:1px solid #31566c;border-radius:14px;display:none;box-shadow:0 8px 28px #0007}.result{padding:12px;border-bottom:1px solid #244257;font-size:13px;cursor:pointer}.result:last-child{border:0}.muted{color:#91acba}.sheet{position:fixed;z-index:1300;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));background:#071b2af7;color:#eef8fc;border:1px solid #31566c;border-radius:20px;padding:15px;box-shadow:0 12px 35px #0008;transform:translateY(calc(100% + 24px));transition:.22s ease;max-width:620px;margin:auto}.sheet.open{transform:translateY(0)}.sheetHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:21px;font-weight:900}.sub{font-size:12px;color:#9ab2c0;margin-top:3px}.close{border:0;background:#183247;color:#fff;width:34px;height:34px;border-radius:10px;font-size:20px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.fact{background:#0c2738;border:1px solid #24475a;border-radius:12px;padding:10px}.fact span{display:block;color:#91acba;font-size:10px;text-transform:uppercase;letter-spacing:.06em}.fact b{display:block;margin-top:4px;font-size:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;text-align:center;text-decoration:none}.primary{background:#43c9d2;color:#062633}.secondary{background:#17364b;color:#eef8fc;border:1px solid #31566c}.proof{font-size:10px;color:#7895a5;margin-top:10px;line-height:1.35}.leaflet-control-zoom{margin-top:64px!important}.leaflet-container{background:#dfe9ee}.leaflet-interactive{cursor:pointer}@media(max-width:430px){.facts{grid-template-columns:1fr 1fr}.fact:last-child{grid-column:1/-1}.title{font-size:19px}}
</style></head><body><div id="map"></div><div class="top"><div class="search"><input id="q" autocomplete="off" placeholder="Locality + lot, e.g. Ain Mreisseh 322"><button id="find">Find</button></div><button class="round" id="gps" aria-label="My location">◎</button><button class="round" id="base" aria-label="Satellite">◐</button></div><div class="status" id="status">Connecting to BPC…</div><div class="results" id="results"></div><div class="sheet" id="sheet"><div class="sheetHead"><div><div class="title" id="parcelTitle">Parcel</div><div class="sub" id="parcelSub"></div></div><button class="close" id="close">×</button></div><div class="facts"><div class="fact"><span>Area</span><b id="area">—</b></div><div class="fact"><span>Zone</span><b id="zone">—</b></div><div class="fact"><span>Authority</span><b id="authority">—</b></div></div><div class="actions"><a class="action primary" id="streetView" target="_blank" rel="noopener">Street View</a><button class="action secondary" id="share">Share parcel</button></div><div class="proof" id="proof"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const PX='https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/bpc-public-proxy';
let manifest=null,loaded=new Map(),loading=new Set(),timer=null,totalLoaded=0,baseMode='street',selectedLayer=null,selectedParcel=null;
const map=L.map('map',{zoomControl:true,preferCanvas:true,zoomSnap:.5}).setView([33.8938,35.501],16.8);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'});
const lots=L.layerGroup().addTo(map),selection=L.layerGroup().addTo(map);
const S=document.getElementById('status'),sheet=document.getElementById('sheet'),results=document.getElementById('results');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(t,k=''){S.textContent=t;S.className='status '+k}
function url(p,q){let u=PX+'?p='+encodeURIComponent(p);if(q!=null)u+='&q='+encodeURIComponent(q);return u}
function zoneColor(z){const n=parseInt(String(z||'').match(/\d+/)?.[0]||'0',10);return ['#6b8491','#32a4a6','#7e9e65','#c69b44','#8c77ad','#c97975','#6e96bb','#ae7d60','#78968b','#9d905a'][n%10]}
function parcelStyle(f,sel=false){const z=f?.properties?.final_zone;return{color:sel?'#f34da7':z?zoneColor(z):'#617985',weight:sel?3:1.1,fillColor:sel?'#f34da7':z?zoneColor(z):'#8ba0aa',fillOpacity:sel?.24:.18}}
function intersects(c,b){const x=c.bbox||[];return x.length>=4&&!(x[2]<b.getWest()||x[0]>b.getEast()||x[3]<b.getSouth()||x[1]>b.getNorth())}
function dist(c,ctr){const p=c.center||[0,0],dx=p[0]-ctr.lng,dy=p[1]-ctr.lat;return dx*dx+dy*dy}
function desired(){if(!manifest||map.getZoom()<16.5)return[];const b=map.getBounds().pad(.2),ctr=map.getCenter(),cap=innerWidth<700?2:4;return manifest.chunks.filter(c=>intersects(c,b)).sort((a,b)=>dist(a,ctr)-dist(b,ctr)).slice(0,cap)}
function normalizeFeature(x){if(x?.type==='Feature')return x;return {type:'Feature',id:x?.lot_uid,properties:x||{},geometry:x?.geometry||null}}
function pval(p,k1,k2){return p?.[k1]??p?.[k2]}
function showParcel(raw,fit=true){const f=normalizeFeature(raw),p=f.properties||{};selectedParcel=f;selection.clearLayers();if(f.geometry){selectedLayer=L.geoJSON(f,{style:x=>parcelStyle(x,true),interactive:false}).addTo(selection);if(fit){try{map.fitBounds(selectedLayer.getBounds(),{paddingTopLeft:[35,90],paddingBottomRight:[35,250],maxZoom:19})}catch{}}}
 const uid=p.lot_uid||f.id||'Parcel',district=String(p.district||p.locality||'').replaceAll('_',' '),lot=p.lot_number||p.lot||'';
 document.getElementById('parcelTitle').textContent=(district?district+' · ':'')+(lot?'Lot '+lot:uid);
 document.getElementById('parcelSub').textContent=uid;
 const a=p.official_area_sqm??p.calculated_area_sqm;document.getElementById('area').textContent=a!=null?Number(a).toLocaleString(undefined,{maximumFractionDigits:1})+' m²':'—';
 document.getElementById('zone').textContent=p.final_status==='HOLD'?'HOLD':(p.final_zone||'Unknown');
 document.getElementById('authority').textContent=p.decision_confidence==='CONTROLLING_AUTHORITY'?'Controlled':'Needs review';
 const lat=Number(p.centroid_lat),lon=Number(p.centroid_lon),sv=p.street_view_url||(Number.isFinite(lat)&&Number.isFinite(lon)?`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`:'#');document.getElementById('streetView').href=sv;
 document.getElementById('proof').textContent=[p.geometry_status,p.source_sheet,p.zoning_source].filter(Boolean).join(' · ');
 sheet.classList.add('open');status('Selected '+uid,'ok');history.replaceState(null,'',location.pathname+'?lot='+encodeURIComponent(uid));
}
async function openUid(uid,fit=true){status('Opening '+uid+'…');try{const r=await fetch(url('/api/parcel-core/'+encodeURIComponent(uid)),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.detail||'HTTP '+r.status);showParcel(j,fit)}catch(e){status('Parcel unavailable: '+e.message,'bad')}}
async function loadChunk(c){if(loaded.has(c.id)||loading.has(c.id))return;loading.add(c.id);try{const r=await fetch(url('/api/city-chunk/'+c.id),{cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();const g=L.geoJSON(j,{style:f=>parcelStyle(f),renderer:L.canvas({padding:.25}),onEachFeature:(f,l)=>l.on('click',e=>{L.DomEvent.stopPropagation(e);const uid=f?.properties?.lot_uid||f?.id;if(uid)openUid(uid,true);else showParcel(f,true)})}).addTo(lots);loaded.set(c.id,g);totalLoaded+=(j.features||[]).length;if(!selectedParcel)status(`${totalLoaded.toLocaleString()} parcels ready · tap a lot or search`,'ok')}catch(e){status('Parcel overlay delayed: '+e.message,'bad')}finally{loading.delete(c.id)}}
async function refresh(){if(!manifest||map.getZoom()<16.5)return;for(const c of desired())await loadChunk(c)}
async function boot(){try{const r=await fetch(url('/api/city-manifest'),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);manifest=await r.json();status('BPC ready · search a lot or tap the map','ok');setTimeout(refresh,500);const uid=new URLSearchParams(location.search).get('lot');if(uid)openUid(uid,true)}catch(e){status('BPC unavailable: '+e.message,'bad')}}
async function search(){const q=document.getElementById('q').value.trim();if(!q)return;status('Searching…');try{const r=await fetch(url('/api/search',q),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.detail||'HTTP '+r.status);const a=j.results||[];results.innerHTML='';if(!a.length){results.innerHTML='<div class="result">No exact parcel match. Use locality + lot number.</div>';results.style.display='block';status('No exact parcel match','bad');return}for(const x of a.slice(0,10)){const p=x.properties||x,d=document.createElement('div');d.className='result';d.innerHTML=`<b>${esc(String(p.district||'').replaceAll('_',' '))} · Lot ${esc(p.lot_number||'—')}</b><br><span class="muted">${esc(p.lot_uid||x.id||'')}</span>`;d.onclick=()=>{results.style.display='none';openUid(p.lot_uid||x.id,true)};results.appendChild(d)}results.style.display='block';status(`${a.length} exact match${a.length===1?'':'es'}`,'ok')}catch(e){status('Search failed: '+e.message,'bad')}}
document.getElementById('find').onclick=search;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
document.getElementById('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],18),e=>status('Location unavailable: '+e.message,'bad'),{enableHighAccuracy:true,timeout:9000});
document.getElementById('base').onclick=()=>{if(baseMode==='street'){map.removeLayer(street);sat.addTo(map);baseMode='sat'}else{map.removeLayer(sat);street.addTo(map);baseMode='street'}};
document.getElementById('close').onclick=()=>{sheet.classList.remove('open');selection.clearLayers();selectedParcel=null;history.replaceState(null,'',location.pathname)};
document.getElementById('share').onclick=async()=>{if(!selectedParcel)return;const p=selectedParcel.properties||{},uid=p.lot_uid||selectedParcel.id,u=location.origin+location.pathname+'?lot='+encodeURIComponent(uid),text=`${String(p.district||'').replaceAll('_',' ')} · Lot ${p.lot_number||''}`;try{if(navigator.share)await navigator.share({title:'BPC Parcel',text,url:u});else{await navigator.clipboard.writeText(u);status('Parcel link copied','ok')}}catch{}};
map.on('moveend zoomend',()=>{clearTimeout(timer);timer=setTimeout(refresh,280)});map.on('click',()=>results.style.display='none');boot();
</script></body></html>
