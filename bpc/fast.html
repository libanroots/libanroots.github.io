<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071725"><title>BPC Progressive Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#map{margin:0;height:100%;width:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{background:#dfe9ee}.top{position:fixed;z-index:1000;top:10px;left:10px;right:10px;display:flex;gap:7px;align-items:center}.search{flex:1;display:flex;background:#102536eF;border:1px solid #31566c;border-radius:15px;overflow:hidden;box-shadow:0 4px 18px #0004}.search input{flex:1;min-width:0;background:transparent;border:0;color:#fff;padding:13px;font-size:14px;outline:0}.search button,.gps{border:0;background:#43c9d2;color:#062633;font-weight:900;padding:0 15px}.gps{height:46px;border-radius:14px}.status{position:fixed;z-index:1000;top:67px;right:10px;max-width:75%;background:#102536eF;color:#edf8fb;border:1px solid #31566c;border-radius:12px;padding:8px 10px;font-size:12px;box-shadow:0 4px 18px #0004}.status.ok{border-color:#2b875d}.status.bad{border-color:#9a4550}.bottom{position:fixed;z-index:1000;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;background:#0c2131ee;border:1px solid #31566c;border-radius:16px;padding:8px;box-shadow:0 4px 18px #0005}.bp{width:52px;height:52px;border-radius:14px;background:#43c9d2;color:#063142;display:grid;place-items:center;font-weight:950;font-size:20px}.nav{display:flex;gap:6px;overflow:auto;flex:1}.nav a,.nav button{white-space:nowrap;border:0;background:#163248;color:#dceef6;text-decoration:none;padding:10px 11px;border-radius:10px;font-size:12px}.legend{position:fixed;z-index:900;left:10px;bottom:83px;background:#102536e6;color:#dceef6;border:1px solid #31566c;border-radius:10px;padding:7px 9px;font-size:10px}.leaflet-control-zoom{margin-top:125px!important}.leaflet-popup-content{font-size:12px;line-height:1.4}.results{position:fixed;z-index:1100;top:64px;left:10px;width:min(390px,calc(100% - 20px));max-height:45vh;overflow:auto;background:#0d2030f8;color:#fff;border:1px solid #31566c;border-radius:12px;display:none}.result{padding:10px;border-bottom:1px solid #244257;font-size:12px}.result:last-child{border:0}.muted{color:#92adbb}.leaflet-container{background:#dfe9ee}@media(max-width:600px){.top{top:7px;left:7px;right:7px}.status{top:62px;right:7px}.bottom{left:7px;right:7px;bottom:7px}.legend{left:7px;bottom:79px}}
</style></head><body><div id="map"></div><div class="top"><div class="search"><input id="q" placeholder="District/locality + lot or LOT_UID"><button id="find">Find</button></div><button class="gps" id="gps">◎</button></div><div class="status" id="status">Connecting to canonical BPC parcel authority…</div><div class="results" id="results"></div><div class="legend">Progressive exact-parcel view · zoom in for lots · zoning follows source attribute</div><div class="bottom"><div class="bp">BP</div><div class="nav"><a href="../live/">SAMERAI</a><button id="street">Street</button><button id="sat">Satellite</button><a href="../cockpit/status.html">Status</a><a href="../cockpit/queue.html">Queue</a></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const PX='https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/bpc-public-proxy';let manifest=null,loaded=new Map(),loading=new Set(),base='street',timer=null,totalLoaded=0;
const map=L.map('map',{zoomControl:true,preferCanvas:true,zoomSnap:.5}).setView([33.894,35.501],17.5);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'});const lots=L.layerGroup().addTo(map);
const S=document.getElementById('status');function status(t,kind=''){S.textContent=t;S.className='status '+kind}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function url(p,q){let u=PX+'?p='+encodeURIComponent(p);if(q!=null)u+='&q='+encodeURIComponent(q);return u}
function color(z){z=String(z||'').toUpperCase();const n=parseInt(z.match(/\d+/)?.[0]||'0',10);return ['#53778b','#39a6a8','#7e9e65','#c29a4a','#8d77ad','#c97975','#6f95b7','#af7d5e','#75958b','#9b8f5d'][n%10]}
function style(f){const z=f?.properties?.final_zone;return{color:z?color(z):'#587484',weight:1.2,fillColor:z?color(z):'#8ba0aa',fillOpacity:.22}}
function popup(f){const p=f.properties||{};return `<b>${esc(p.lot_uid||f.id||'Parcel')}</b><br>${esc(p.district||p.locality||'')} · Lot ${esc(p.lot_number||p.lot||'—')}<br>Zone ${esc(p.final_zone||'HOLD / unknown')}`}
function intersects(c,b){const x=c.bbox||[];if(x.length<4)return false;return !(x[2]<b.getWest()||x[0]>b.getEast()||x[3]<b.getSouth()||x[1]>b.getNorth())}function dist(c,ctr){const p=c.center||[0,0],dx=p[0]-ctr.lng,dy=p[1]-ctr.lat;return dx*dx+dy*dy}
function desired(){if(!manifest||map.getZoom()<16.5)return[];const b=map.getBounds().pad(.35),ctr=map.getCenter(),cap=innerWidth<700?4:8;return manifest.chunks.filter(c=>intersects(c,b)).sort((a,b)=>dist(a,ctr)-dist(b,ctr)).slice(0,cap)}
async function loadChunk(c){if(loaded.has(c.id)||loading.has(c.id))return;loading.add(c.id);status(`Loading parcel block ${c.id}… ${totalLoaded.toLocaleString()} already visible`);try{const r=await fetch(url('/api/city-chunk/'+c.id),{cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();const g=L.geoJSON(j,{style,onEachFeature:(f,l)=>l.bindPopup(()=>popup(f)),renderer:L.canvas({padding:.3})}).addTo(lots);loaded.set(c.id,g);const n=(j.features||[]).length;totalLoaded+=n;status(`Map ready · ${totalLoaded.toLocaleString()} parcels loaded progressively of ${Number(manifest.feature_count||0).toLocaleString()}`,'ok')}catch(e){status('Parcel block '+c.id+' failed: '+e.message,'bad')}finally{loading.delete(c.id)}}
async function refresh(){if(!manifest)return;if(map.getZoom()<16.5){status(`Zoom in to load exact lots · ${Number(manifest.feature_count||0).toLocaleString()} parcels available`);return}const w=desired();if(!w.length){status('No canonical parcel blocks intersect this view.');return}for(let i=0;i<w.length;i+=2)await Promise.all(w.slice(i,i+2).map(loadChunk))}
async function boot(){try{const r=await fetch(url('/api/city-manifest'),{cache:'no-store'});if(!r.ok)throw Error('manifest HTTP '+r.status);manifest=await r.json();status(`Authority connected · ${Number(manifest.feature_count||0).toLocaleString()} parcels · loading nearest blocks`,'ok');refresh()}catch(e){status('BPC authority unavailable: '+e.message,'bad')}}
map.on('moveend zoomend',()=>{clearTimeout(timer);timer=setTimeout(refresh,220)});document.getElementById('street').onclick=()=>{if(base!=='street'){map.removeLayer(sat);street.addTo(map);base='street'}};document.getElementById('sat').onclick=()=>{if(base!=='sat'){map.removeLayer(street);sat.addTo(map);base='sat'}};document.getElementById('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],18),e=>status('Location unavailable: '+e.message,'bad'),{enableHighAccuracy:true,timeout:9000});
async function search(){const q=document.getElementById('q').value.trim(),box=document.getElementById('results');if(!q)return;status('Searching canonical BPC…');try{const r=await fetch(url('/api/search',q),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.detail||'HTTP '+r.status);const a=j.results||j.features||j.matches||[];box.innerHTML='';if(!a.length){box.innerHTML='<div class="result">No match.</div>'}for(const x of a.slice(0,12)){const p=x.properties||x,d=document.createElement('div');d.className='result';d.innerHTML=`<b>${esc(p.lot_uid||p.id||p.title||'Result')}</b><br><span class="muted">${esc(p.district||p.locality||'')} ${p.lot_number?'· Lot '+esc(p.lot_number):''}</span>`;d.onclick=()=>{const c=x.center||p.center;if(Array.isArray(c)&&c.length>=2)map.setView([Number(c[1]),Number(c[0])],18);else if(Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon)))map.setView([Number(p.lat),Number(p.lon)],18);box.style.display='none'};box.appendChild(d)}box.style.display='block';status(`${a.length} search result${a.length===1?'':'s'}`,'ok')}catch(e){status('Search failed: '+e.message,'bad')}}document.getElementById('find').onclick=search;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});map.on('click',()=>document.getElementById('results').style.display='none');boot();
</script></body></html>
