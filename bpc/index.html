<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071725"><title>BPC Mobile Map</title><style>html,body{margin:0;height:100%;background:#071725;color:#edf8fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}.card{max-width:420px;padding:28px;text-align:center}.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:linear-gradient(145deg,#45d9da,#37b2c9);display:grid;place-items:center;color:#073044;font-weight:950;font-size:22px}.muted{color:#8eabb8;font-size:13px;line-height:1.5}.btn{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:12px;background:#43c9d2;color:#062633;text-decoration:none;font-weight:900}</style></head><body><div class="card"><div class="logo">BP</div><h2>BPC Mobile Map</h2><p class="muted" id="msg">Opening the permanent mobile map…</p><a class="btn" id="open" href="#">Open map</a></div><script>(async()=>{const m=document.getElementById('msg'),a=document.getElementById('open');try{const r=await fetch('./backend.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('registry');const j=await r.json();if(!j.url)throw Error('url');a.href=j.url+'/';m.textContent='Connecting to BPC Mobile Light…';location.replace(j.url+'/');}catch(e){m.textContent='The BPC gateway is being refreshed. Tap Open map to retry.';a.onclick=()=>location.reload();}})();</script></body></html>
