<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAMERAI Pair Diagnostic</title><style>body{margin:0;background:#071019;color:#eef6ff;font-family:system-ui;padding:18px}.card{max-width:760px;margin:auto;background:#0d1925;border:1px solid #20364a;border-radius:14px;padding:16px}pre{white-space:pre-wrap;background:#08131e;padding:12px;border-radius:10px}.ok{color:#7ce0a6}.bad{color:#ff9da8}</style></head><body><div class="card"><h2>SAMERAI Pair Diagnostic</h2><p>This page creates one non-approved diagnostic device request. It never receives an owner AES key and cannot access private data.</p><pre id="out">Starting…</pre></div><script>
const API='https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/samerai-mobile',o=document.getElementById('out');let lines=[];function log(x){lines.push(x);o.textContent=lines.join('\n')}
function bu(b){let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function hexSha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
(async()=>{try{log('1. WebCrypto: '+(crypto?.subtle?'OK':'MISSING'));const h=await fetch(API+'?action=health',{cache:'no-store'});log('2. Relay health HTTP '+h.status);const pkR=await fetch(API+'?action=public_key',{cache:'no-store'});log('3. Public key HTTP '+pkR.status);const pk=await pkR.json();log('4. Public key type '+pk?.jwk?.kty);const pub=await crypto.subtle.importKey('jwk',pk.jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);log('5. RSA import OK');const raw=crypto.getRandomValues(new Uint8Array(32));const wrapped=bu(await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw));log('6. RSA wrap OK · '+wrapped.length+' chars');const id=crypto.randomUUID(),token=bu(crypto.getRandomValues(new Uint8Array(32))),token_sha256=await hexSha(token);log('7. Local device/token generation OK');const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),12000);const r=await fetch(API+'?action=pair_start',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,body:JSON.stringify({device_id:id,token_sha256,wrapped_key:wrapped,user_agent:'SAMERAI_PAIR_DIAGNOSTIC_20260908'})});log('8. pair_start HTTP '+r.status);let x={};try{x=await r.json()}catch{}log('9. pair_start response '+JSON.stringify(x));if(r.ok)log('RESULT: CLIENT CRYPTO + PAIR_START PATH REACHABLE. Remaining approval depends on BossHome worker.');else log('RESULT: PAIR_START FAILED.')}catch(e){log('FAILED: '+e.name+' · '+e.message)}})();
</script></body></html>
