<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081019"><title>SAMERAI Active Work</title><style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#eaf3fb;font-family:Inter,system-ui,sans-serif}.top{position:sticky;top:0;background:#0a1622f2;border-bottom:1px solid #20364b;padding:14px 16px;z-index:5}.brand{font-size:18px;font-weight:900;letter-spacing:.07em}.sub{color:#8ea4b8;font-size:11px;margin-top:4px}.wrap{max-width:760px;margin:auto;padding:10px}.back{display:inline-block;color:#9ec9e8;text-decoration:none;font-size:12px;margin:4px 0 8px}.row{background:#0d1925;border:1px solid #20364a;border-radius:14px;padding:13px;margin:8px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:9px}.title{font-weight:900;font-size:15px}.tag{font-size:9px;font-weight:900;border:1px solid #34516a;border-radius:999px;padding:4px 7px;color:#b7cce0;white-space:nowrap}.DONE{border-color:#2f7957;color:#7ce0a6}.RUNNING,.ACTIVE,.VERIFYING,.UNVERIFIED_ACTIVE,.STALE_UNVERIFIED{border-color:#80672e;color:#f6d46c}.STALE_PUBLIC{border-color:#8a4149;color:#ff9da8}.BLOCKED,.FAILED,.OWNER_GATE{border-color:#8a4149;color:#ff9da8}.QUEUED,.WAITING_DEPENDENCY{border-color:#80672e;color:#f6d46c}.lane{font-size:10px;color:#7890a5;margin-top:5px}.more{margin-top:8px;padding-top:7px;border-top:1px solid #1b3042}.more summary{font-size:11px;color:#9fc0d9;cursor:pointer}.more p{font-size:11px;line-height:1.45;color:#c8d9e7;margin:7px 0 0}.empty{background:#0d1925;border:1px solid #20364a;border-radius:14px;padding:16px;color:#8ea4b8;font-size:12px}.foot{font-size:10px;color:#6f8799;text-align:center;margin:12px}.count{font-size:11px;color:#8ea4b8;margin:6px 0 10px}</style></head><body><div class="top"><div class="brand">SAMERAI ACTIVE WORK</div><div class="sub" id="stamp">Loading fresh execution evidence…</div></div><div class="wrap"><a class="back" href="./status.html">← Truth Board</a><div class="count" id="count"></div><div id="rows"></div><div class="foot">Sanitized historical mirror, not a live worker ledger. Fresh independent execution evidence is required before claiming active work.</div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rank(x){const p=String(x.priority||'P9').replace(/\D/g,'')||9,s=String(x.status||'');const b=/BLOCKED|FAILED|OWNER_GATE/.test(s)?0:/RUNNING/.test(s)?1:/WAITING|QUEUED/.test(s)?2:3;return Number(p)*10+b}
// SANITIZED PUBLIC ARCHIVE ONLY. Never infer live workers from a queue mirror.
const FRESH_MS=24*60*60*1000;
function mirrorFresh(q){const ms=Date.parse(q.updated_utc||'');const age=Date.now()-ms;return Number.isFinite(age)&&age>=0&&age<=FRESH_MS}
function truthfulStatus(x,fresh){const raw=String(x.status||'UNKNOWN').toUpperCase();if(!fresh)return 'STALE_UNVERIFIED';if(['RUNNING','ACTIVE','ACTIVE_VERIFIED','EXECUTING'].includes(raw))return 'UNVERIFIED_ACTIVE';return raw}
function render(q){
 const fresh=mirrorFresh(q),all=Array.isArray(q.items)?q.items:[];
 const unfinished=all.filter(x=>!['DONE','RETIRED','SUPERSEDED','CANCELLED'].includes(String(x.status||'').toUpperCase())).sort((a,b)=>rank(a)-rank(b));
 const show=unfinished.slice(0,5);
 document.getElementById('stamp').textContent='Public mirror updated '+(q.updated_utc||'unknown')+(fresh?' · active worker status unverified':' · STALE ARCHIVE — NOT LIVE EXECUTION');
 document.getElementById('count').textContent=unfinished.length?`${unfinished.length} recorded unfinished items · showing ${show.length}`:'No recorded unfinished items';
 document.getElementById('rows').innerHTML=show.map(x=>{
  const status=truthfulStatus(x,fresh),raw=String(x.status||'UNKNOWN').toUpperCase();
  return `<div class="row"><div class="head"><div class="title">${esc(x.title||x.id||'Work item')}</div><span class="tag ${esc(status)}">${esc(status)}</span></div><div class="lane">${esc(x.lane||'')}${x.priority?' · '+esc(x.priority):''} · recorded: ${esc(raw)}</div><details class="more"><summary>Evidence / blocker / next</summary>${x.summary?`<p>${esc(x.summary)}</p>`:''}${x.blocker?`<p><b>Blocker:</b> ${esc(x.blocker)}</p>`:''}${x.next_action?`<p><b>Next:</b> ${esc(x.next_action)}</p>`:''}</details></div>`
 }).join('')||'<div class="empty">No unfinished execution item in the sanitized archive.</div>';
}
async function load(){try{const r=await fetch('./queue-public.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json())}catch(e){document.getElementById('stamp').textContent='Queue evidence unavailable';document.getElementById('rows').innerHTML='<div class="empty">Nothing shown because fresh queue evidence could not be loaded.</div>'}}
load();setInterval(load,60000);
</script></body></html>
