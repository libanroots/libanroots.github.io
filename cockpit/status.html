<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071019"><title>SAMERAI Truth Board</title><style>
*{box-sizing:border-box}body{margin:0;background:#071019;color:#eef6ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:#0b1724f4;border-bottom:1px solid #20364b;padding:14px 15px}.brand{font-weight:950;letter-spacing:.08em}.sub{font-size:11px;color:#8ea4b8;margin-top:4px}.wrap{max-width:920px;margin:auto;padding:10px}.hero{background:#0d1925;border:1px solid #20364a;border-radius:16px;padding:14px;margin-bottom:10px}.heroLine{display:flex;align-items:center;justify-content:space-between;gap:10px}.overall{font-size:24px;font-weight:950}.rule{font-size:11px;color:#9eb4c6;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{display:block;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:850;font-size:13px;background:#17324a;color:#eef6ff;border:1px solid #31506b}.btn.primary{background:#245e91}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:#0d1925;border:1px solid #20364a;border-radius:14px;padding:12px;min-height:108px}.name{font-size:16px;font-weight:900;margin:3px 0 8px}.state{font-size:10px;font-weight:950;border-radius:999px;padding:4px 8px;display:inline-block}.WORKING,.ACTIVE,.REACHABLE{background:#153c2b;color:#7ce0a6}.WORKING_WITH_ISSUES,.PENDING{background:#443715;color:#f6d46c}.BLOCKED,.FAILED{background:#4a1d23;color:#ff9da8}.NOT_YET_ACCEPTED,.UNKNOWN{background:#273447;color:#a9c9e8}.stamp{font-size:10px;color:#7890a5;margin-top:8px}.more{margin-top:8px;border-top:1px solid #1d3143;padding-top:7px}.more summary{font-size:11px;color:#9fc0d9;cursor:pointer}.more p{font-size:11px;line-height:1.4;color:#c8d9e7;margin:7px 0 0}.advanced{text-align:center;margin:12px 0 4px}.advanced a{color:#7695ad;font-size:11px;text-decoration:none}.badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tiny{font-size:10px;color:#8ea4b8}.error{color:#ff9da8}.good{color:#7ce0a6}@media(max-width:600px){.grid{grid-template-columns:1fr}.overall{font-size:21px}.card{min-height:96px}}
</style></head><body><div class="top"><div class="brand">SAMERAI TRUTH BOARD</div><div class="sub" id="stamp">Loading fresh evidence…</div></div><div class="wrap"><div class="hero"><div class="heroLine"><div><div class="tiny">CURRENT REALITY</div><div class="overall" id="overall">CHECKING</div></div><div class="badges"><span class="tiny" id="relay">Relay ?</span><span class="tiny" id="key">Key ?</span></div></div><div class="rule">Evidence only. No status is inferred from a running process, a rendered page, or an old queue item.</div><div class="actions"><a class="btn primary" href="../bpc/">Open BPC Map</a><a class="btn" href="./">Voice / Ask SAMERAI</a></div></div><div class="grid" id="cards"></div><div class="advanced"><a href="./queue.html">Advanced execution details</a></div></div><script>
const API='https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/samerai-mobile';
const order=['SAMERAI Core','BPC / Lebanon Map','MyOffice','Review.Properties','BOSSPC Storage','BossHome / BOSSPC Transport'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function probe(){for(const [id,a] of [['relay','health'],['key','public_key']]){try{const r=await fetch(API+'?action='+a,{cache:'no-store'});document.getElementById(id).textContent=(id==='relay'?'Relay ':'Key ')+(r.ok?'✓':'×');document.getElementById(id).className='tiny '+(r.ok?'good':'error')}catch{document.getElementById(id).textContent=(id==='relay'?'Relay ':'Key ')+'×';document.getElementById(id).className='tiny error'}}}
async function load(){try{const r=await fetch('../live/status.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('status');const j=await r.json();document.getElementById('overall').textContent=String(j.overall||'UNKNOWN').replaceAll('_',' ');document.getElementById('stamp').textContent='Evidence mirror '+j.generated_at;const map=new Map((j.sections||[]).map(x=>[x.name,x])),cards=document.getElementById('cards');cards.innerHTML='';for(const n of order){const x=map.get(n)||{name:n,state:'UNKNOWN',detail:'No fresh evidence in mirror.',action:'Acquire fresh evidence.',last_verified:'unknown'};const d=document.createElement('div');d.className='card';d.innerHTML=`<span class="state ${esc(x.state)}">${esc(String(x.state).replaceAll('_',' '))}</span><div class="name">${esc(x.name)}</div><div class="stamp">Verified ${esc(x.last_verified)}</div><details class="more"><summary>Show proof / next action</summary><p>${esc(x.detail)}</p><p><b>Next:</b> ${esc(x.action)}</p></details>`;cards.appendChild(d)}}catch(e){document.getElementById('overall').textContent='STATUS UNAVAILABLE';document.getElementById('stamp').textContent='No fresh mirror';document.getElementById('cards').innerHTML='<div class="card error">No status shown because fresh evidence could not be loaded.</div>'}}
load();probe();setInterval(load,60000);setInterval(probe,60000);
</script></body></html>
