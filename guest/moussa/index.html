<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e36"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>موسى × شبارو | أطلس العائلة</title>
<style>
:root{--ink:#15323b;--navy:#102e36;--gold:#b58a54;--muted:#718085;--line:#e3e9e7;--mist:#eef5f3;--bg:#f6f8f7;--white:#fff;--warn:#9c6830}*{box-sizing:border-box}

button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7bbab6;outline-offset:2px}button{border:0}a{color:#116979}
.wrap{max-width:1060px;margin:auto;padding:0 17px}.top{background:#102e36;color:#fff;position:sticky;top:0;z-index:6;border-bottom:1px solid #3f5659}.top .wrap{display:flex;align-items:center;gap:13px;min-height:61px}.logo{width:35px;height:35px;border:1px solid #bba379;color:#efd9b4;border-radius:12px;display:grid;place-items:center;font:700 18px Georgia}.brand{flex:1;min-width:0}.brand b{display:block;font-size:16px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.brand small{color:#a8c5c3;font-size:10px;display:block;letter-spacing:.5px}.limit{font-size:11px;color:#ddc49d;border:1px solid #4c6866;border-radius:999px;padding:4px 8px;white-space:nowrap}

.mainTab{background:#f0f4f3;color:#4d6a6e;border-radius:13px;padding:12px 9px;font-size:13px;font-weight:800;border:1px solid #e0e9e6}.mainTab.active{background:#153d44;color:white;border-color:#153d44;box-shadow:0 4px 12px #123d431b}
main{padding:18px 0 88px}.intro{padding:5px 1px 15px}.sub{font-size:11px;font-weight:800;color:#a88049;letter-spacing:1.1px;text-transform:uppercase}.intro h1{font-size:clamp(23px,4.6vw,33px);line-height:1.35;margin:5px 0 7px;letter-spacing:-.5px}.intro p{color:var(--muted);font-size:13px;margin:0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 19px}.stat{background:white;padding:13px;border:1px solid var(--line);border-radius:15px}.stat strong{font-size:24px;display:block;line-height:1.2}.stat span{font-size:11px;color:var(--muted)}
.branchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.branch{min-height:160px;background:#fff;border:1px solid var(--line);border-radius:18px;text-align:right;padding:18px 15px;box-shadow:0 7px 22px #18383a08}.branch:active{transform:scale(.99)}.branch .symbol{display:grid;place-items:center;width:34px;height:34px;background:#f4efe5;color:#a4793f;border-radius:11px;font-size:19px}.branch b{display:block;font-size:17px;margin:14px 0 3px}.branch small{font-size:12px;color:#7a8585}.branch .hint{font-size:11px;margin-top:12px;color:#17676c;font-weight:700}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px;box-shadow:0 5px 20px #28454106}.card h2{font-size:17px;margin:0 0 12px}.soft{color:var(--muted);font-size:12px}.smallcap{font-size:12px;font-weight:800;color:#537277;margin:16px 1px 9px}.toolbar{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:12px 0}.pill{padding:9px 13px;white-space:nowrap;background:white;color:#5f7678;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700}.pill.active{background:#17434a;color:#fff;border-color:#17434a}
.search{display:flex;gap:8px;background:#fff;border:1px solid #dce7e4;border-radius:15px;padding:7px 10px;margin:12px 0}.search input{border:0;background:transparent;padding:8px 5px;outline:0;flex:1;min-width:0;font-size:15px;color:var(--ink)}.search .mag{color:#7e9896;padding:9px 2px}
.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:11px;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;text-align:right;color:var(--ink)}.avatar{width:37px;height:37px;border-radius:12px;flex-shrink:0;background:#edf4f1;display:grid;place-items:center;color:#54807b;font-size:16px}.itemInfo{min-width:0;flex:1}.item b{font-size:14px;display:block;line-height:1.45}.item small{font-size:11px;color:var(--muted);display:block}.chev{color:#8eaaa5}.chip{font-size:10px;border:1px solid #dce8e1;padding:3px 7px;border-radius:999px;color:#277b5b;white-space:nowrap}.chip.provisional{border-color:#e9d6b5;color:#a46a30;background:#fffbf1}
.familyPaths{display:grid;grid-template-columns:1fr 1fr;gap:8px}.path{border:1px solid #deebe7;background:#f8fbfa;border-radius:13px;padding:12px;text-align:right;color:#33545a}.path b{display:block;font-size:13px}.path small{font-size:11px;color:#758c87}.treeLinks{display:flex;flex-wrap:wrap;gap:7px}.treelink{padding:7px 10px;border:1px solid var(--line);background:#fafcfb;color:#345d60;border-radius:10px;font-size:12px}
.house{border:1px solid #e2eae7;border-radius:14px;padding:14px;margin-bottom:9px;background:white}.house b{font-size:15px}.house small{display:block;color:#738886}.houseMembers{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.houseMembers button{border-radius:8px;background:#eef4f2;color:#275a5b;padding:6px 9px;font-size:11px}
.empty{padding:22px 15px;text-align:center;border:1px dashed #cdded7;background:#fff;border-radius:14px;color:#69817c;font-size:13px}
.notice{padding:12px 13px;border:1px solid #eadfca;background:#fffcf6;border-radius:13px;color:#84643c;font-size:12px;line-height:1.8}
.warning{color:#936b40;font-size:12px}.foot{margin-top:24px;padding-top:17px;border-top:1px solid var(--line);font-size:11px;color:#80918d;text-align:center}
.overlay{display:none;position:fixed;inset:0;background:#071b21a8;z-index:20;align-items:end;justify-content:center}.overlay.open{display:flex}.sheet{background:#fff;width:100%;max-width:660px;max-height:87dvh;overflow:auto;padding:20px;border-radius:23px 23px 0 0;box-shadow:0 0 55px #0003}.sheet .close{float:left;background:#eff3f1;border-radius:11px;padding:7px 13px;color:#456}.sheet h2{font-size:23px;line-height:1.3;margin:17px 0 4px}.personline{border-bottom:1px solid var(--line);padding:12px 0}.personline strong{display:block;font-size:12px}.personline p{margin:5px 0;font-size:13px}.linkbtn{padding:8px 10px;border:1px solid #dce9e5;background:#f9fbfa;border-radius:10px;color:#256668;margin:4px 3px;font-size:12px}
.secondary{font-size:12px;background:#eaf3f1;border-radius:12px;padding:12px;line-height:1.7}.modeRow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.modeRow button{font-size:11px;padding:10px 4px;border-radius:12px;background:#edf3f1;color:#4e7779}.modeRow button.active{background:#133b43;color:#fff}.action{width:100%;background:#17464b;color:#fff;padding:12px;border-radius:12px;font-size:13px;font-weight:750}
@media(min-width:730px){.branch{min-height:145px}.branchgrid{gap:16px}.sheet{margin:auto;border-radius:24px;max-height:85dvh}.list{grid-template-columns:repeat(2,1fr)}.metrics{max-width:540px}.familyPaths{grid-template-columns:repeat(4,1fr)}}
@media(max-width:370px){.brand b{font-size:14px}.limit{font-size:9px}.wrap{padding-left:12px;padding-right:12px}.branch{padding:13px}.branch b{font-size:15px}.stat{padding:10px}.stat strong{font-size:21px}}
</style></head>
<body><header class="top"><div class="wrap"><div class="logo">R₂</div><div class="brand"><b>ذاكرة آل الحاج موسى وشبارو</b><small>SAMERAI REALITY · FAMILY EDITION</small></div><span class="limit">ضيف · 30 يوم</span></div></header>
<div class="sectionnav"><div class="wrap"><button class="mainTab active" data-main="family">♧ شجرة موسى وشبارو</button><button class="mainTab" data-main="lebanon">⌕ لبنان | البحث</button></div></div>
<main><div class="wrap"><div id="body"><div class="card">جارِ التحقق من صلاحية الدعوة وتحميل السجل العائلي…</div></div><div class="foot">وثائق تاريخية · روابط موثقة · لا دمج للأسماء المتشابهة دون دليل</div></div></main>
<div id="shade" class="overlay"><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
const API="https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/moussa-30d-directory";
const state={main:"family",tab:"home",branch:"all",q:"",type:"name",focus:"dany",profile:""};
const $=s=>document.querySelector(s);
let DATA=null;
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normalize(s){return String(s||"").normalize("NFKD").replace(/[\u064B-\u065F\u0670]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ـ/g,"").toLowerCase().trim()}
function person(id){return DATA?.persons.find(p=>p.id===id)}
function byName(s){return DATA?.persons.find(p=>normalize(p.n)===normalize(s))}
function candidate(p){return p.status!=="DOCUMENTED"&&p.status!=="CORROBORATE"}
function status(p){return '<span class="chip '+(candidate(p)?"provisional":"")+'">'+(candidate(p)?"قيد المراجعة":"موثق في المصدر")+'</span>'}
function mini(p){return '<button class="item" data-person="'+esc(p.id)+'"><span class="avatar">♧</span><span class="itemInfo"><b>'+esc(p.n)+'</b><small>'+esc(p.rel||p.role||"")+'</small></span>'+status(p)+'<span class="chev">‹</span></button>'}
function links(ids){return ids.filter((id,i,a)=>a.indexOf(id)===i).map(id=>person(id)).filter(Boolean).map(p=>'<button class="treelink" data-person="'+esc(p.id)+'">'+esc(p.n)+'</button>').join("")}
function adjacent(id,kind){const e=DATA.edges.filter(x=>x.k===kind);if(kind==="parent")return {up:e.filter(x=>x.t===id).map(x=>x.f),down:e.filter(x=>x.f===id).map(x=>x.t)};return {both:e.filter(x=>x.t===id).map(x=>x.f).concat(e.filter(x=>x.f===id).map(x=>x.t))}}
function intro(name,sub){return '<div class="intro"><div class="sub">SAMERAI · PRIVATE FAMILY ATLAS</div><h1>'+name+'</h1><p>'+sub+'</p></div>'}
function stats(){return '<div class="metrics"><div class="stat"><strong>'+DATA.persons.length+'</strong><span>اسم في شجرة البحث</span></div><div class="stat"><strong>'+DATA.households.length+'</strong><span>بيت / أسرة</span></div><div class="stat"><strong>'+DATA.edges.length+'</strong><span>رابطة موثقة أو قيد التحقق</span></div></div>'}
function tabsFamily(){return '<div class="toolbar"><button class="pill '+(state.tab==="home"?"active":"")+'" data-tab="home">الفروع</button><button class="pill '+(state.tab==="people"?"active":"")+'" data-tab="people">من هو من؟</button><button class="pill '+(state.tab==="houses"?"active":"")+'" data-tab="houses">البيوت</button><button class="pill '+(state.tab==="tree"?"active":"")+'" data-tab="tree">شجرة شخص</button></div>'}
function treeFocus(){const p=person(state.focus)||person("dany");let up=adjacent(p.id,"parent").up,down=adjacent(p.id,"parent").down,sp=adjacent(p.id,"spouse").both;return '<div class="card"><div class="sub">من هو؟</div><h2>'+esc(p.n)+'</h2><p class="soft">'+esc(p.rel||"")+'</p>'+status(p)+'</div>'+
'<div class="smallcap">الوالدان / الأصول</div>'+(up.length?'<div class="treeLinks">'+links(up)+'</div>':'<div class="empty">لم يتم توثيق أصل إضافي لهذا السجل</div>')+
'<div class="smallcap">الزوج / الزوجة</div>'+(sp.length?'<div class="treeLinks">'+links(sp)+'</div>':'<div class="empty">لا توجد رابطة زواج موثقة في هذا السجل</div>')+
'<div class="smallcap">الأبناء / الفروع</div>'+(down.length?'<div class="treeLinks">'+links(down)+'</div>':'<div class="empty">لا توجد ذرية مسجلة في المصادر الحالية</div>')+
'<p class="soft">اضغط على أي اسم للانتقال إلى بطاقته، أو افتح «استعراض الشجرة» من البطاقة.</p>'}
function familyView(){let top=intro("موسى × شبارو","فرع الأب حسين محمود الحاج موسى، وفرع الأم ابتسام محمد شبارو. الأسماء والروابط مصنفة وفق الأدلة.")+stats()+tabsFamily();
if(state.tab==="home")return top+'<div class="branchgrid"><button class="branch" data-focus="pgf"><span class="symbol">♧</span><b>آل الحاج موسى</b><small>محمود الحاج موسى ← حسين ← داني وأخوته</small><div class="hint">استكشف فرع الأب ←</div></button><button class="branch" data-focus="mgf"><span class="symbol">♧</span><b>آل شبارو</b><small>عبد الكريم ← محمد ← ابتسام وشقيقاتها وأشقاؤها</small><div class="hint">استكشف فرع الأم ←</div></button></div><div class="card" style="margin-top:16px"><h2>كيف نقرأ الأسماء؟</h2><p class="soft">نميز بين الشخص الموثق، والعلاقة المرجّحة، والرابط الذي يحتاج تحققاً. عدد أفراد الشجرة ليس عدداً لكل من يحمل الاسم نفسه.</p><button class="action" data-tab="people">افتح دليل الأشخاص</button></div>';
if(state.tab==="tree")return top+treeFocus();
if(state.tab==="houses"){let html=DATA.households.map(h=>'<div class="house"><b>'+esc(h.name)+' • '+esc(h.partner||"")+'</b><small>'+esc(h.b||"")+' · '+h.children.length+' أسماء واردة في سجل البيت</small><div class="houseMembers">'+h.children.map(n=>{const p=byName(n);return p?'<button data-person="'+esc(p.id)+'">'+esc(n)+'</button>':'<button disabled>'+esc(n)+'</button>'}).join("")+'</div>'+(h.notes?'<p class="warning">'+esc(h.notes)+'</p>':'')+'</div>').join("");return top+html}
let q=normalize(state.q);let list=DATA.persons.filter(p=>(!q||normalize([p.n,p.rel,p.dad,p.mom,p.role].join(" ")).includes(q))&&(state.branch==="all"||state.branch==="paternal"&&(p.b==="paternal"||p.b==="cousins")||state.branch==="maternal"&&(p.b==="maternal"||p.b==="ancestry")||state.branch==="pending"&&candidate(p)));
return top+'<div class="search"><span class="mag">⌕</span><input id="familySearch" value="'+esc(state.q)+'" placeholder="اسم الشخص أو اسم الأب أو الأم…"></div><div class="toolbar">'+[['all','الجميع'],['paternal','آل موسى'],['maternal','آل شبارو'],['pending','تحتاج تدقيقاً']].map(x=>'<button class="pill '+(state.branch===x[0]?"active":"")+'" data-branch="'+x[0]+'">'+x[1]+'</button>').join("")+'</div><p class="soft">'+list.length+' نتيجة من السجل العائلي الحالي</p><div class="list">'+(list.map(mini).join("")||'<div class="empty">لا يوجد تطابق في السجل المتاح</div>')+'</div>'}
function lebanonView(){const type=state.type;let q=normalize(state.q);let list=type==="name"?DATA.persons.filter(p=>!q||normalize([p.n,p.rel,p.dad,p.mom,p.role].join(" ")).includes(q)):type==="house"?DATA.households.filter(h=>!q||normalize([h.name,h.partner,h.children.join(" ")].join(" ")).includes(q)):[];let t='<div class="intro"><div class="sub">LEBANON · SOURCE-AWARE SEARCH</div><h1>البحث في لبنان</h1><p>الأسماء والأسر المتاحة ضمن هذا الإصدار فقط. لا يفتح هذا الحساب قواعد المعلومات الوطنية الخاصة.</p></div><div class="modeRow">'+[['name','الاسم'],['phone','الهاتف'],['plate','السيارة / اللوحة'],['house','الأسرة']].map(x=>'<button class="'+(type===x[0]?"active":"")+'" data-type="'+x[0]+'">'+x[1]+'</button>').join("")+'</div><div class="search"><span class="mag">⌕</span><input id="lebanonSearch" value="'+esc(state.q)+'" placeholder="'+esc(type==="name"?"ابحث عن اسم أو اسم أحد الأبوين":type==="house"?"اسم البيت أو أفراد الأسرة":type==="phone"?"رقم الهاتف المصرّح بإتاحته":"رقم لوحة السيارة المصرّح بإتاحتها")+'"></div>';
if(type==="phone"||type==="plate")return t+'<div class="empty"><b>لا توجد سجلات متاحة لهذا النوع</b><p>لم تتم إضافة '+(type==="phone"?"أرقام هاتف":"لوحات سيارات")+' موثقة ومصرّح بمشاركتها. هذا الحقل جاهز لبيانات يوافق أصحابها على مشاركتها، وليس بحثاً مفتوحاً في سجلات خاصة.</p></div><div class="notice" style="margin-top:12px">بيانات الاتصال أو ملكية المركبات في مصادر تاريخية لا تثبت الاستخدام أو الملكية الحالية، ولا يجوز ربطها بشخص آخر عبر تشابه الاسم.</div>';
if(type==="house")return t+'<p class="soft">'+list.length+' أسرة في سجل البحث</p>'+list.map(h=>'<div class="house"><b>'+esc(h.name)+'</b><small>'+esc(h.partner||"")+'</small><div class="houseMembers">'+h.children.map(n=>'<button data-person="'+esc((byName(n)||{}).id||"")+'">'+esc(n)+'</button>').join("")+'</div></div>').join("");
return t+'<div class="notice">النتائج أدناه من سجل عائلة موسى وشبارو الحالي، وليست نتائج بحث شامل لكل سكان لبنان.</div><p class="soft" style="margin-top:13px">'+list.length+' نتيجة</p><div class="list">'+(list.map(mini).join("")||'<div class="empty">لا توجد نتيجة مطابقة.</div>')+'</div>'}
function draw(restoreFocus){if(!DATA)return;const active=document.activeElement;const name=active?.id;const cursor=active?.selectionStart;$('#body').innerHTML=state.main==="family"?familyView():lebanonView();document.querySelectorAll('[data-main]').forEach(b=>b.classList.toggle('active',b.dataset.main===state.main));if(restoreFocus&&name){const el=document.getElementById(name);if(el){el.focus();try{el.setSelectionRange(cursor,cursor)}catch(_e){}}}}
function showPerson(id){let p=person(id);if(!p)return;state.profile=id;const parent=adjacent(id,"parent"),partners=adjacent(id,"spouse").both,sib=DATA.persons.filter(x=>x.id!==id&&parent.up.length&&adjacent(x.id,"parent").up.some(a=>parent.up.includes(a))).map(x=>x.id);
let blocks=[["الوالدان",parent.up],["الشركاء / الزواج",partners],["الأبناء",parent.down],["الأشقاء بحسب الرابط المتاح",sib]];let text='<button class="close" data-close>إغلاق ✕</button><div class="sub">بطاقة شخصية • من هو من؟</div><h2>'+esc(p.n)+'</h2><p class="soft">'+esc(p.rel||"")+'</p>'+status(p);
if(p.role)text+='<div class="personline"><strong>الدور أو المهنة</strong><p>'+esc(p.role)+'</p></div>';
if(p.dates)text+='<div class="personline"><strong>التواريخ المسجلة</strong><p>'+esc(p.dates)+'</p></div>';
if(p.dad||p.mom)text+='<div class="personline"><strong>أسماء الوالدين في المصادر</strong><p>'+esc(p.dad||"غير معروف")+' / '+esc(p.mom||"غير معروف")+'</p></div>';
for(const [name,ids] of blocks)if(ids.length)text+='<div class="personline"><strong>'+name+'</strong><div class="treeLinks" style="margin-top:8px">'+links(ids)+'</div></div>';
if(p.notes)text+='<div class="personline"><strong>ملاحظات التدقيق</strong><p class="soft">'+esc(p.notes)+'</p></div>';
if(p.url&&/^https:\/\//.test(p.url))text+='<p><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">افتح المصدر الأصلي</a></p>';
text+='<div class="secondary">الهاتف · السيارات · عنوان السكن: غير متوفرة أو غير مخوّلة للمشاركة في هذا الإصدار. لا يُستخدم تشابه الاسم لإسناد ملكية أو عنوان.</div><p><button class="action" data-focus="'+esc(id)+'">افتح شجرة هذا الشخص</button></p>';
$('#sheet').innerHTML=text;$('#shade').classList.add('open')}
function enterFocus(id){state.main="family";state.tab="tree";state.focus=id;state.q="";$('#shade').classList.remove('open');draw();window.scrollTo({top:0,behavior:"smooth"})}
document.addEventListener("click",e=>{const n=e.target.closest("[data-main]");if(n){state.main=n.dataset.main;state.q="";draw();return}const t=e.target.closest("[data-tab]");if(t){state.tab=t.dataset.tab;state.q="";draw();return}const b=e.target.closest("[data-branch]");if(b){state.branch=b.dataset.branch;draw();return}const y=e.target.closest("[data-type]");if(y){state.type=y.dataset.type;state.q="";draw();return}const f=e.target.closest("[data-focus]");if(f){enterFocus(f.dataset.focus);return}const p=e.target.closest("[data-person]");if(p){showPerson(p.dataset.person);return}if(e.target.closest("[data-close]")||e.target.id==="shade")$('#shade').classList.remove("open")});
document.addEventListener("input",e=>{if(e.target.id==="familySearch"||e.target.id==="lebanonSearch"){state.q=e.target.value;draw(true)}});
(async()=>{const key=new URLSearchParams(location.search).get("k")||"";if(!key){$('#body').innerHTML='<div class="card"><h2>الصفحة مخصّصة للمدعوين</h2><p>يرجى فتح الرابط الكامل الذي وصلك.</p></div>';return}
try{const res=await fetch(API+"?k="+encodeURIComponent(key),{credentials:"omit",cache:"no-store",referrerPolicy:"no-referrer"});if(res.status===410){$('#body').innerHTML='<div class="card"><h2>انتهت صلاحية الدعوة</h2><p>يرجى طلب دعوة جديدة.</p></div>';return}if(!res.ok)throw Error("ACCESS_"+res.status);DATA=await res.json();if(!Array.isArray(DATA.persons)||!Array.isArray(DATA.households)||!Array.isArray(DATA.edges))throw Error("DATA_INVALID");draw()}catch(err){$('#body').innerHTML='<div class="card"><h2>تعذر فتح السجل</h2><p class="soft">الرابط غير صالح، أو خدمة البيانات غير متصلة. لا تتضمن هذه الصفحة أي معلومات وطنية دون تصريح.</p></div>'}})();
</script></body></html>
