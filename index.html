<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#081019"><title>SAMERAI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#081019;color:#eef6ff;font-family:Inter,system-ui,sans-serif}body{display:flex;flex-direction:column}.top{padding:14px 16px;border-bottom:1px solid #23384d;background:#0d1722}.brand{font-size:20px;font-weight:700;letter-spacing:.12em}.sub{font-size:12px;color:#8ea4bb;margin-top:5px}.ok{color:#8eedad}.warn{color:#ffd08a}.chat{flex:1;overflow:auto;padding:16px 12px 150px}.msg{max-width:88%;padding:12px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;line-height:1.45}.u{margin-left:auto;background:#23466d}.a{background:#121e2b;border:1px solid #263d55}.meta{font-size:10px;color:#90a4b8;margin-top:6px}.composer{position:fixed;bottom:0;left:0;right:0;background:#081019ed;backdrop-filter:blur(8px);padding:10px 10px max(10px,env(safe-area-inset-bottom))}.opts,.bar{display:flex;gap:8px;max-width:900px;margin:auto;align-items:center}.opts{font-size:11px;color:#a7b9ca;margin-bottom:7px}.opts select{background:#111e2b;color:#fff;border:1px solid #304a64;border-radius:8px;padding:6px}.bar textarea{flex:1;min-height:48px;max-height:130px;resize:none;border-radius:16px;border:1px solid #304a64;background:#0f1a26;color:#fff;padding:12px;font:inherit}.btn{height:48px;min-width:48px;border:0;border-radius:14px;background:#21364c;color:#fff;font-size:19px}.send{background:#2c5f91}.live{background:#963b42}.empty{color:#91a5ba;text-align:center;padding:18vh 24px 0}.empty b{display:block;color:#eef6ff;font-size:26px;margin-bottom:8px}</style></head><body><div class="top"><div class="brand">SAMERAI</div><div class="sub" id="status">Encrypted relay · checking BossHome…</div></div><div class="chat" id="chat"><div class="empty" id="empty"><b>Talk to SAMERAI.</b>Speak or type naturally. Your phone is the interface; BossHome is the private engine.</div></div><div class="composer"><div class="opts"><select id="lang"><option value="en-US">English</option><option value="ar-LB">العربية</option><option value="fr-FR">Français</option></select><label><input id="hands" type="checkbox"> hands-free</label><label><input id="speak" type="checkbox" checked> voice reply</label></div><div class="bar"><button class="btn" id="mic">🎙</button><textarea id="input" placeholder="Message SAMERAI…"></textarea><button class="btn send" id="send">➤</button></div></div><script>
const API='https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/samerai-mobile';const q=new URLSearchParams(location.search),channel=q.get('c')||'',h=new URLSearchParams(location.hash.slice(1)),keyText=h.get('k')||'';const chat=document.getElementById('chat'),empty=document.getElementById('empty'),input=document.getElementById('input'),statusEl=document.getElementById('status'),mic=document.getElementById('mic'),lang=document.getElementById('lang'),hands=document.getElementById('hands'),speakBox=document.getElementById('speak');let conv=localStorage.getItem('samerai_mobile_conv')||crypto.randomUUID();localStorage.setItem('samerai_mobile_conv',conv);let last=localStorage.getItem('samerai_mobile_last')||null,k=null;function add(role,text,meta=''){empty.style.display='none';const d=document.createElement('div');d.className='msg '+(role==='u'?'u':'a');d.appendChild(document.createTextNode(text||''));if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m)}chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}function ub(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function bu(b){let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}async function key(){if(k)return k;k=await crypto.subtle.importKey('raw',ub(keyText),{name:'AES-GCM'},false,['encrypt','decrypt']);return k}async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(),new TextEncoder().encode(JSON.stringify(o)));return bu(iv)+'.'+bu(ct)}async function dec(s){const [a,b]=s.split('.'),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},await key(),ub(b));return JSON.parse(new TextDecoder().decode(pt))}
function voiceScore(v,l){let n=(v.name||'').toLowerCase(),s=0;if((v.lang||'').toLowerCase()===l.toLowerCase())s+=60;else if((v.lang||'').slice(0,2).toLowerCase()===l.slice(0,2).toLowerCase())s+=30;if(/natural|neural/.test(n))s+=55;if(/google/.test(n))s+=40;if(/microsoft/.test(n))s+=30;return s}function speakText(t){if(!speakBox.checked||!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).slice(0,6000));u.lang=/[\u0600-\u06ff]/.test(t)?'ar-LB':lang.value;const vs=speechSynthesis.getVoices()||[],v=vs.slice().sort((a,b)=>voiceScore(b,u.lang)-voiceScore(a,u.lang))[0];if(v)u.voice=v;u.rate=.93;u.pitch=1.02;u.onend=()=>{if(hands.checked)setTimeout(startMic,600)};speechSynthesis.speak(u)}async function poll(id,node){for(let i=0;i<900;i++){await new Promise(r=>setTimeout(r,1000));let r;try{r=await fetch(API+'?action=poll&c='+encodeURIComponent(channel)+'&id='+encodeURIComponent(id),{cache:'no-store'})}catch(e){continue}if(!r.ok)continue;const x=await r.json();if(x.status==='DONE'||x.status==='FAILED'){const out=await dec(x.response_ciphertext);node.firstChild.nodeValue=out.reply||out.error||x.status;const m=document.createElement('div');m.className='meta';m.textContent='mission '+(out.mission_id||'?');node.appendChild(m);if(out.mission_id){last=out.mission_id;localStorage.setItem('samerai_mobile_last',last)}statusEl.textContent='Connected to canonical SAMERAI · BossHome';statusEl.className='sub ok';speakText(out.reply||'');return}}node.firstChild.nodeValue='Mission remains active in SAMERAI. You can leave and return.'}async function send(){const text=input.value.trim();if(!text)return;if(!channel||!keyText){alert('Invalid pairing link');return}input.value='';add('u',text);const n=add('a','SAMERAI is working…','encrypted → BossHome');try{const r=await fetch(API+'?action=send&c='+encodeURIComponent(channel),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:conv,last_mission_id:last,request_ciphertext:await enc({message:text})})});const x=await r.json();if(!r.ok){n.firstChild.nodeValue=x.error||'Relay error';return}poll(x.id,n)}catch(e){n.firstChild.nodeValue='Connection error. Your mission was not assumed complete.'}}document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,final='';async function micPermission(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return true;const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});s.getTracks().forEach(t=>t.stop());return true}async function startMic(){if(!SR){input.placeholder='Use your phone keyboard microphone in this browser.';return}try{await micPermission()}catch(e){statusEl.textContent='Microphone blocked — allow it in browser site settings.';statusEl.className='sub warn';return}if(rec)try{rec.abort()}catch{};final='';rec=new SR();rec.lang=lang.value;rec.interimResults=true;rec.continuous=false;rec.onstart=()=>{mic.classList.add('live');statusEl.textContent='Listening…';statusEl.className='sub ok'};rec.onresult=e=>{let p='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=(final?' ':'')+t;else p+=t}input.value=(final||p).trim()};rec.onerror=e=>{mic.classList.remove('live');statusEl.textContent='Voice: '+e.error+' · keyboard mic remains available';statusEl.className='sub warn'};rec.onend=()=>{mic.classList.remove('live');if(final.trim())send()};try{rec.start()}catch(e){}}mic.onclick=startMic;(async()=>{try{if(!channel||!keyText)throw Error('pairing link incomplete');await key();const r=await fetch(API+'?action=health&c='+encodeURIComponent(channel),{cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.error||'relay unavailable');statusEl.textContent='Encrypted relay ready · SAMERAI';statusEl.className='sub ok'}catch(e){statusEl.textContent='Pairing error: '+e.message;statusEl.className='sub warn'}})();
</script></body></html>
