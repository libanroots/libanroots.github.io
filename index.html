<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#081019"><title>SAMERAI</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#081019;color:#eef6ff;font-family:Inter,system-ui,sans-serif}body{display:flex;flex-direction:column}.top{padding:14px 16px;border-bottom:1px solid #23384d;background:#0d1722}.brand{font-size:20px;font-weight:800;letter-spacing:.12em}.sub{font-size:12px;color:#8ea4bb;margin-top:5px}.ok{color:#8eedad}.warn{color:#ffd08a}.chat{flex:1;overflow:auto;padding:16px 12px 160px}.msg{max-width:88%;padding:12px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;line-height:1.45}.u{margin-left:auto;background:#23466d}.a{background:#121e2b;border:1px solid #263d55}.meta{font-size:10px;color:#90a4b8;margin-top:6px}.empty{color:#91a5ba;text-align:center;padding:16vh 24px 0}.empty b{display:block;color:#eef6ff;font-size:27px;margin-bottom:9px}.connect{margin:20px auto 0;display:block;border:0;border-radius:16px;padding:14px 20px;background:#2c5f91;color:#fff;font-weight:700;font-size:16px}.composer{position:fixed;bottom:0;left:0;right:0;background:#081019ed;backdrop-filter:blur(8px);padding:10px 10px max(10px,env(safe-area-inset-bottom))}.opts,.bar{display:flex;gap:8px;max-width:900px;margin:auto;align-items:center}.opts{font-size:11px;color:#a7b9ca;margin-bottom:7px}.opts select{background:#111e2b;color:#fff;border:1px solid #304a64;border-radius:8px;padding:6px}.bar textarea{flex:1;min-height:48px;max-height:130px;resize:none;border-radius:16px;border:1px solid #304a64;background:#0f1a26;color:#fff;padding:12px;font:inherit}.btn{height:48px;min-width:48px;border:0;border-radius:14px;background:#21364c;color:#fff;font-size:19px}.send{background:#2c5f91}.live{background:#963b42}.navbtn{position:absolute;right:14px;top:11px;border:0;background:#18283a;color:#fff;border-radius:10px;padding:8px 11px;font-size:18px}.drawer{position:fixed;z-index:20;top:0;right:-86%;width:82%;max-width:360px;height:100%;background:#0d1722;border-left:1px solid #294158;padding:22px 16px;transition:right .22s;overflow:auto}.drawer.open{right:0}.drawer h2{margin:0 0 14px}.topic{padding:11px 10px;border-bottom:1px solid #203449;color:#dce9f5}.topic span{float:right;color:#8ea4bb;font-size:12px}.capture{color:#8eedad}button:disabled,textarea:disabled{opacity:.45}</style></head><body><div class="top"><div class="brand">SAMERAI</div><button class="navbtn" id="nav">☰</button><div class="sub" id="status">Secure owner device not paired yet.</div></div><aside class="drawer" id="drawer"><h2>Your Life OS</h2><div id="topics"><div class="topic" data-t="Life">Life <span>0</span></div><div class="topic" data-t="People">People <span>0</span></div><div class="topic" data-t="Business">Business <span>0</span></div><div class="topic" data-t="Review.Properties">Review.Properties <span>0</span></div><div class="topic" data-t="MyOffice">MyOffice <span>0</span></div><div class="topic" data-t="BPC">BPC <span>0</span></div><div class="topic" data-t="SAMERAI">SAMERAI <span>0</span></div><div class="topic" data-t="Decisions">Decisions <span>0</span></div><div class="topic" data-t="Tasks">Tasks <span>0</span></div><div class="topic" data-t="Research Rules">Research Rules <span>0</span></div></div><p class="sub" id="lifeTotal">Loading canonical Life Index…</p></aside><div class="chat" id="chat"><div class="empty" id="empty"><b>Talk to SAMERAI.</b>Your phone gets its own encrypted key. Supabase only relays ciphertext.<button class="connect" id="connect">Connect this phone securely</button></div></div><div class="composer"><div class="opts"><select id="lang"><option value="en-US">English</option><option value="ar-LB">العربية</option><option value="fr-FR">Français</option></select><label><input id="hands" type="checkbox"> hands-free</label><label><input id="speak" type="checkbox" checked> voice reply</label></div><div class="bar"><button class="btn" id="mic" disabled>🎙</button><textarea id="input" placeholder="Pair this phone first…" disabled></textarea><button class="btn send" id="send" disabled>➤</button></div></div><script>
const API='https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/samerai-mobile',STORE='samerai_device_v2';const TOPIC_STORE='samerai_topic_counts_v1';const statusEl=document.getElementById('status'),connectBtn=document.getElementById('connect'),chat=document.getElementById('chat'),empty=document.getElementById('empty'),input=document.getElementById('input'),mic=document.getElementById('mic'),sendBtn=document.getElementById('send'),lang=document.getElementById('lang'),hands=document.getElementById('hands'),speakBox=document.getElementById('speak');let dev=null,aesKey=null,conv=localStorage.getItem('samerai_mobile_conv_v2')||crypto.randomUUID(),last=localStorage.getItem('samerai_mobile_last_v2')||null;localStorage.setItem('samerai_mobile_conv_v2',conv);const drawer=document.getElementById('drawer'),nav=document.getElementById('nav');let topicCounts={};try{topicCounts=JSON.parse(localStorage.getItem(TOPIC_STORE)||'{}')}catch{topicCounts={}}function renderTopics(){document.querySelectorAll('.topic').forEach(x=>{x.querySelector('span').textContent=topicCounts[x.dataset.t]||0})}function bumpCapture(mc){if(!mc)return;for(const s of (mc.scopes||[]))topicCounts[s]=(topicCounts[s]||0)+1;for(const k of (mc.kinds||[])){const map={task:'Tasks',decision:'Decisions',reasoning_pattern:'Research Rules'};if(map[k])topicCounts[map[k]]=(topicCounts[map[k]]||0)+1}localStorage.setItem(TOPIC_STORE,JSON.stringify(topicCounts));renderTopics()}nav.onclick=()=>{drawer.classList.toggle('open');if(drawer.classList.contains('open'))refreshLifeIndex()};drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};renderTopics();
function bu(b){let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function ub(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}async function hexSha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}function loadDev(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}}function saveDev(x){localStorage.setItem(STORE,JSON.stringify(x))}function add(role,text,meta=''){empty.style.display='none';const d=document.createElement('div');d.className='msg '+(role==='u'?'u':'a');d.appendChild(document.createTextNode(text||''));if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m)}chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function importAes(){if(aesKey)return aesKey;if(!dev?.aes)throw Error('DEVICE_NOT_PAIRED');aesKey=await crypto.subtle.importKey('raw',ub(dev.aes),{name:'AES-GCM'},false,['encrypt','decrypt']);return aesKey}async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await importAes(),new TextEncoder().encode(JSON.stringify(o)));return bu(iv)+'.'+bu(ct)}async function dec(s){const [a,b]=s.split('.'),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},await importAes(),ub(b));return JSON.parse(new TextDecoder().decode(pt))}function auth(){return {'Authorization':'Bearer '+dev.token}}
async function createPair(){const id=crypto.randomUUID(),token=bu(crypto.getRandomValues(new Uint8Array(32))),raw=crypto.getRandomValues(new Uint8Array(32));statusEl.textContent='Creating this phone’s encrypted owner key…';statusEl.className='sub warn';const pk=await (await fetch(API+'?action=public_key',{cache:'no-store'})).json();const pub=await crypto.subtle.importKey('jwk',pk.jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);const wrapped=bu(await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw));dev={device_id:id,token,aes:bu(raw),pending:true};saveDev(dev);const r=await fetch(API+'?action=pair_start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:id,token_sha256:await hexSha(token),wrapped_key:wrapped,user_agent:navigator.userAgent})});if(!r.ok)throw Error((await r.json()).error||'PAIR_START_FAILED');return waitPair()}
async function waitPair(){statusEl.textContent='Pairing securely with BossHome…';statusEl.className='sub warn';for(let i=0;i<900;i++){const r=await fetch(API+'?action=pair_status&device_id='+encodeURIComponent(dev.device_id),{headers:auth(),cache:'no-store'});if(r.ok){const x=await r.json();if(x.status==='APPROVED'){dev.pending=false;saveDev(dev);return activate() }if(x.status==='REVOKED')throw Error('DEVICE_REVOKED')}await new Promise(r=>setTimeout(r,1000))}throw Error('PAIRING_WINDOW_TIMEOUT')}
async function activate(){await importAes();connectBtn.style.display='none';statusEl.textContent='Encrypted owner device connected · BossHome';statusEl.className='sub ok';input.disabled=false;mic.disabled=false;sendBtn.disabled=false;input.placeholder='Message SAMERAI…';setTimeout(refreshLifeIndex,250);return true}async function boot(){dev=loadDev();if(dev){try{const r=await fetch(API+'?action=pair_status&device_id='+encodeURIComponent(dev.device_id),{headers:auth(),cache:'no-store'});if(r.ok){const x=await r.json();if(x.status==='APPROVED')return activate();if(x.status==='PENDING')return waitPair()}localStorage.removeItem(STORE);dev=null}catch{}}statusEl.textContent='Secure owner device not paired yet.';statusEl.className='sub'}connectBtn.onclick=async()=>{connectBtn.disabled=true;try{if(!dev)await createPair();else await waitPair()}catch(e){statusEl.textContent='Pairing failed: '+e.message;statusEl.className='sub warn';connectBtn.disabled=false}};
function voiceScore(v,l){let n=(v.name||'').toLowerCase(),s=0;if((v.lang||'').toLowerCase()===l.toLowerCase())s+=60;else if((v.lang||'').slice(0,2).toLowerCase()===l.slice(0,2).toLowerCase())s+=30;if(/natural|neural/.test(n))s+=55;if(/google/.test(n))s+=40;if(/microsoft/.test(n))s+=30;return s}function speakText(t){if(!speakBox.checked||!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).slice(0,6000));u.lang=/[\u0600-\u06ff]/.test(t)?'ar-LB':lang.value;const vs=speechSynthesis.getVoices()||[],v=vs.slice().sort((a,b)=>voiceScore(b,u.lang)-voiceScore(a,u.lang))[0];if(v)u.voice=v;u.rate=.94;u.pitch=1.02;u.onend=()=>{if(hands.checked)setTimeout(startMic,600)};speechSynthesis.speak(u)}
async function poll(id,node){for(let i=0;i<900;i++){await new Promise(r=>setTimeout(r,1000));let r;try{r=await fetch(API+'?action=poll&device_id='+encodeURIComponent(dev.device_id)+'&id='+encodeURIComponent(id),{headers:auth(),cache:'no-store'})}catch{continue}if(!r.ok)continue;const x=await r.json();if(x.status==='DONE'||x.status==='FAILED'){const out=await dec(x.response_ciphertext);node.firstChild.nodeValue=out.reply||out.error||x.status;const m=document.createElement('div');m.className='meta';m.textContent='mission '+(out.mission_id||'?');if(out.memory_capture){bumpCapture(out.memory_capture);m.textContent+=' · stored → '+(out.memory_capture.scopes||[]).join(' / ')+' · '+(out.memory_capture.kinds||[]).join(', ');m.classList.add('capture')}node.appendChild(m);if(out.mission_id){last=out.mission_id;localStorage.setItem('samerai_mobile_last_v2',last)}statusEl.textContent='Connected to canonical SAMERAI · BossHome';statusEl.className='sub ok';speakText(out.reply||'');setTimeout(refreshLifeIndex,6500);return}}node.firstChild.nodeValue='Mission remains active in SAMERAI. You can leave and return.'}
function applyLifeIndex(idx){const sc=idx.scopes||{},ki=idx.kinds||{},tc={};tc['Life']=(sc.Life||0)+(sc.LIFE_OS||0);tc['People']=ki.person_context||0;tc['Review.Properties']=sc.REVIEW_PROPERTIES||0;tc['MyOffice']=sc.MYOFFICE||0;tc['BPC']=sc.BPC||0;tc['SAMERAI']=(sc.SAMERAI||0)+(sc.SAMERAI_CORE||0);tc['Decisions']=ki.decision||0;tc['Tasks']=ki.task||0;tc['Research Rules']=ki.reasoning_pattern||0;const exclude=new Set(['Life','LIFE_OS','REVIEW_PROPERTIES','MYOFFICE','BPC','SAMERAI','SAMERAI_CORE']);tc['Business']=Object.entries(sc).filter(([k])=>!exclude.has(k)).reduce((a,[,v])=>a+(Number(v)||0),0);topicCounts=tc;renderTopics();const t=document.getElementById('lifeTotal');if(t){const g=idx.graph||{};t.textContent='Canonical Life Memory: '+(idx.records||0)+' records · '+(idx.live_records||0)+' active · '+(idx.historical_records||0)+' historical · Graph '+(g.nodes||'?')+' nodes / '+(g.edges||'?')+' edges'}}
async function refreshLifeIndex(){if(!dev||dev.pending)return;try{const r=await fetch(API+'?action=send',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({device_id:dev.device_id,conversation_id:'life-index-'+conv,last_mission_id:null,request_ciphertext:await enc({control:'life_index'})})});if(!r.ok)return;const x=await r.json();for(let i=0;i<45;i++){await new Promise(z=>setTimeout(z,700));const pr=await fetch(API+'?action=poll&device_id='+encodeURIComponent(dev.device_id)+'&id='+encodeURIComponent(x.id),{headers:auth(),cache:'no-store'});if(!pr.ok)continue;const px=await pr.json();if(px.status==='DONE'){const out=await dec(px.response_ciphertext);if(out.life_index)applyLifeIndex(out.life_index);return}}}catch(e){}}
function brokenTranscript(t){const w=String(t||'').toLowerCase().match(/[a-z0-9']+/g)||[];if(w.length<120)return false;const uq=(new Set(w)).size/w.length;const g=new Map();let rep=0;for(let i=0;i+3<w.length;i++){const k=w.slice(i,i+4).join(' '),n=(g.get(k)||0)+1;g.set(k,n);if(n>1)rep++}return uq<0.10||rep>Math.max(40,Math.floor(w.length*.35))}
async function send(){const text=input.value.trim();if(!text||!dev||dev.pending)return;if(brokenTranscript(text)){statusEl.textContent='Voice transcript looks duplicated. Nothing was sent or stored — tap mic and try again.';statusEl.className='sub warn';return}input.value='';add('u',text);const n=add('a','SAMERAI is working…','encrypted → BossHome');try{const r=await fetch(API+'?action=send',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({device_id:dev.device_id,conversation_id:conv,last_mission_id:last,request_ciphertext:await enc({message:text})})});const x=await r.json();if(!r.ok){n.firstChild.nodeValue=x.error||'Relay error';return}poll(x.id,n)}catch(e){n.firstChild.nodeValue='Connection error. Your mission was not assumed complete.'}}sendBtn.onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,voiceText='',voiceInterim='',voiceWanted=false,voiceSending=false,silenceTimer=null;let voiceState='IDLE',vadStream=null,vadCtx=null,vadAnalyser=null,vadData=null,vadRaf=null,vadSpeechSeen=false,vadLastSpeech=0;const VOICE_SILENCE_SEND_MS=3800,VAD_THRESHOLD=.035;
function setVoiceState(s,msg,cls='sub ok'){voiceState=s;if(msg){statusEl.textContent=msg;statusEl.className=cls}}
function clearVoiceTimer(){if(silenceTimer){clearTimeout(silenceTimer);silenceTimer=null}}
function mergeVoice(a,b){a=String(a||'').replace(/\s+/g,' ').trim();b=String(b||'').replace(/\s+/g,' ').trim();if(!a)return b;if(!b)return a;const al=a.toLowerCase(),bl=b.toLowerCase();if(al===bl||al.endsWith(' '+bl))return a;if(bl.startsWith(al))return b;if(al.startsWith(bl))return a;const A=a.split(' '),B=b.split(' '),m=Math.min(64,A.length,B.length);for(let k=m;k>=1;k--){if(A.slice(-k).join(' ').toLowerCase()===B.slice(0,k).join(' ').toLowerCase())return A.concat(B.slice(k)).join(' ')}return a+' '+b}
function showVoice(){input.value=mergeVoice(voiceText,voiceInterim)}
async function startVad(){if(!hands.checked||vadStream)return;try{vadStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});vadCtx=new (window.AudioContext||window.webkitAudioContext)();const src=vadCtx.createMediaStreamSource(vadStream);vadAnalyser=vadCtx.createAnalyser();vadAnalyser.fftSize=512;vadData=new Uint8Array(vadAnalyser.fftSize);src.connect(vadAnalyser);vadSpeechSeen=false;vadLastSpeech=performance.now();const tick=()=>{if(!vadAnalyser||!voiceWanted)return;vadAnalyser.getByteTimeDomainData(vadData);let sum=0;for(const x of vadData){const n=(x-128)/128;sum+=n*n}const rms=Math.sqrt(sum/vadData.length),now=performance.now();if(rms>VAD_THRESHOLD){vadSpeechSeen=true;vadLastSpeech=now;if('speechSynthesis'in window&&speechSynthesis.speaking)speechSynthesis.cancel()}if(vadSpeechSeen&&now-vadLastSpeech>VOICE_SILENCE_SEND_MS&&voiceWanted&&!voiceSending){finishVoice(true);return}vadRaf=requestAnimationFrame(tick)};vadRaf=requestAnimationFrame(tick)}catch(e){setVoiceState('LISTENING','Listening Â· voice activity detector unavailable, tap mic to finish.','sub warn')}}
function stopVad(){if(vadRaf)cancelAnimationFrame(vadRaf);vadRaf=null;vadAnalyser=null;vadData=null;if(vadStream){vadStream.getTracks().forEach(t=>t.stop());vadStream=null}if(vadCtx){try{vadCtx.close()}catch{}vadCtx=null}}
function launchRecognizer(){if(!voiceWanted||!SR)return;rec=new SR();rec.lang=lang.value;rec.interimResults=true;rec.continuous=true;rec.onstart=()=>{mic.classList.add('live');setVoiceState('LISTENING',hands.checked?'Listening hands-free Â· send after a real 3.8 s silence.':'Listening Â· tap mic again when finished.')};rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(e.results[i].isFinal){if(t)voiceText=mergeVoice(voiceText,t)}else interim=mergeVoice(interim,t)}voiceInterim=interim;showVoice()};rec.onerror=e=>{if(e.error==='aborted'||e.error==='no-speech')return;voiceWanted=false;stopVad();mic.classList.remove('live');setVoiceState('ERROR','Voice: '+e.error+' Â· tap mic to retry','sub warn')};rec.onend=()=>{if(voiceWanted&&!voiceSending)setTimeout(launchRecognizer,180);else mic.classList.remove('live')};try{rec.start()}catch{if(voiceWanted)setTimeout(launchRecognizer,250)}}
function finishVoice(doSend=true){if(!voiceWanted&&voiceSending)return;voiceWanted=false;clearVoiceTimer();if(voiceInterim){voiceText=mergeVoice(voiceText,voiceInterim);voiceInterim=''}showVoice();try{if(rec)rec.stop()}catch{}stopVad();mic.classList.remove('live');const text=input.value.trim();if(!doSend){setVoiceState('READY','Voice captured Â· review or tap send.');return}if(!text){setVoiceState('IDLE','No speech captured Â· tap mic to retry.','sub warn');return}if(brokenTranscript(text)){setVoiceState('ERROR','Transcript repetition detected. Nothing was sent or stored.','sub warn');return}if(!voiceSending){voiceSending=true;setVoiceState('SENDING','Voice captured Â· sending to SAMERAIâ€¦');setTimeout(async()=>{await send();voiceSending=false},100)}}
async function startMic(){if(!SR){input.placeholder='Use your phone keyboard microphone in this browser.';return}if(voiceWanted){finishVoice(true);return}if('speechSynthesis'in window&&speechSynthesis.speaking)speechSynthesis.cancel();try{if(navigator.permissions){try{const p=await navigator.permissions.query({name:'microphone'});if(p.state==='denied')throw Error('MIC_DENIED')}catch(e){if(e.message==='MIC_DENIED')throw e}}}catch{setVoiceState('ERROR','Microphone blocked â€” allow it in browser site settings.','sub warn');return}voiceText='';voiceInterim='';voiceWanted=true;voiceSending=false;input.value='';setVoiceState('STARTING','Opening microphoneâ€¦');if(hands.checked)await startVad();launchRecognizer()}
mic.onclick=startMic;boot();
</script></body></html>
