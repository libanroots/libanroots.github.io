<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAMERAI Graph Intelligence</title>
<style>
:root{--ink:#102c3d;--bg:#f2f7f8;--card:#fff;--teal:#48d8da;--muted:#6f7f87;--line:#dbe7e9;--warn:#fff1c7;--good:#dcf8ef}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#172d38}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:18px 18px 14px;box-shadow:0 3px 18px #0003}
h1{font-size:26px;margin:0 0 4px}.sub{color:#c5d5dc;font-size:14px}.status{font-size:13px;margin-top:8px;color:#80eee8}
.askbar{display:grid;grid-template-columns:1fr 48px 76px;gap:8px;margin-top:14px}input,button{font:inherit}
#ask{border:0;border-radius:16px;padding:14px 16px;font-size:17px;min-width:0}.send,.mic{border:0;border-radius:16px;font-weight:800;background:var(--teal);color:#062c35}
.mic{font-size:16px}.chips{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding:12px 0 0}.chip{white-space:nowrap;border:1px solid #477084;background:#163e53;color:#fff;border-radius:999px;padding:9px 13px}
main{padding:16px;max-width:1120px;margin:auto}.contextbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}.contextbar button,.contextbar select{border:1px solid #477084;background:#163e53;color:#fff;border-radius:999px;padding:6px 10px}.conversation{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:260px;overflow:auto}.bubble{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.35}.bubble.user{align-self:flex-end;background:#0f3549;color:#fff}.bubble.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 5px 20px #1434470c}
.hero{background:linear-gradient(135deg,#fff,#eafafa)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.badge{background:#e9f3f5;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:700}.badge.good{background:var(--good)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.metric b{font-size:24px;display:block}
section details{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}summary{padding:15px 16px;font-weight:800;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.inside{border-top:1px solid var(--line);padding:13px}
.candidate{border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0}.candidate button{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 13px;font-weight:800;margin-top:9px}
#graphWrap{position:relative;height:500px;background:#071b26;border-radius:18px;overflow:hidden}#graphSvg{width:100%;height:100%;touch-action:manipulation}.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.legend span{font-size:11px;background:#edf3f4;padding:5px 7px;border-radius:999px}
.nlabel{font-size:12px;fill:#fff;paint-order:stroke;stroke:#071b26;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.nlabel.optional{display:none}#inspector{position:absolute;right:8px;bottom:8px;left:8px;background:#fffffff2;border-radius:14px;padding:10px;max-height:42%;overflow:auto;display:none}.eitem{padding:9px 0;border-bottom:1px solid #edf1f2}.eitem:last-child{border:0}.tiny{font-size:12px;color:#72828a}
.notice{background:var(--warn);border-radius:14px;padding:11px 12px;margin:9px 0}.suggest{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:5px 5px 0 0}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}#graphWrap{height:620px}}@media(max-width:430px){h1{font-size:22px}.askbar{grid-template-columns:1fr 44px 68px}main{padding:12px}}
</style></head><body>
<header><h1>SAMERAI Graph Intelligence</h1><div class="sub">Conversational intelligence · identity → evidence → relationships → analytics</div><div id="status" class="status">Checking graph engine…</div><div class="contextbar"><span id="contextText">No subject selected</span><button id="clearSubject" type="button">New subject</button><select id="voiceLang" aria-label="Voice language"><option value="en-US">Voice EN</option><option value="ar-LB">Voice AR</option><option value="fr-FR">Voice FR</option></select></div>
<div class="askbar"><input id="ask" autocomplete="off" placeholder="Ask normally: show cars, family, properties, documents or relationships…"><button id="mic" class="mic" title="Voice conversation" aria-label="Voice conversation">Talk</button><button id="send" class="send">Ask</button></div>
<div id="chips" class="chips"><button class="chip" data-q="Show everything connected to this person">Everything</button><button class="chip" data-q="Show family graph">Family graph</button><button class="chip" data-q="Show his vehicles">Vehicles</button><button class="chip" data-q="Show his properties">Properties</button><button class="chip" data-q="Show his documents">Documents</button></div></header>
<main><div id="conversation" class="conversation" aria-live="polite"></div><div id="answer" class="card hero"><b>Ask SAMERAI normally.</b><div class="muted">The graph engine will resolve the object first, then expand only evidence relevant to the question.</div></div><div id="content"></div></main>
<script>(function(){
const U='https://tjndgzmstayfxtxbbegd.supabase.co/functions/v1/bpc-owner-api',KEY='bpc_reality_v2_owner_session_v1';
const nf=window.fetch.bind(window);
window.fetch=async function(input,options){
 const path=typeof input==='string'?input:(input&&input.url)||'';
 if(/^\/(?:graph-api|reality-api|api)\//.test(path)){
  let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
  if(!s||!s.token||s.expires<Date.now())return new Response(JSON.stringify({detail:'LOGIN_REQUIRED'}),{status:401,headers:{'Content-Type':'application/json'}});
  const m=String(options?.method||'GET').toUpperCase();
  const body=m==='POST'&&options?.body?JSON.parse(String(options.body)):{};
  return nf(U+'?action=proxy',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.token},body:JSON.stringify({path,method:m,body}),signal:options?.signal,cache:'no-store'});
 }
 return nf(input,options);
};
})();</script><script src="./graph.js"></script></body></html>
